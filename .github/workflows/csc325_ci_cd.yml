name: CSC325 CI/CD

# Trigger: run automatically on every push to main
on:
  push:
    branches: [main]

jobs:
  # Stage 1: check out the code and install Python
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Show Python version
        run: python --version

  # Stage 2: install packages from requirements.txt
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list

  # Stage 3: run the full test suite (a failing test fails the pipeline)
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements.txt
        run: pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test --verbosity 2

  # Stage 4: deploy to Vercel, only after Test passes
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Show live URL
        run: echo "Live at https://csc325-ci-cd.vercel.app/api/hello/"
