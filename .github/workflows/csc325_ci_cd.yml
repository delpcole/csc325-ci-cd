name: CSC325 CI/CD

# Trigger: run on every push to main
on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Setup, Dependencies, Test
    runs-on: ubuntu-latest
    steps:
      - name: Setup - check out code
        uses: actions/checkout@v4

      - name: Setup - install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies - install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test - run full test suite
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy
    # Deploy waits for the test job and only runs if it passed
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
